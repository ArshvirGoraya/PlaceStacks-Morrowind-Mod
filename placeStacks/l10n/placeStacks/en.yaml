---

ModName: "Place Stacks"
ModDescription: |-
  Inspired by Valheim's Place Stacks mechanic.

  - Quickly place matching or all items into containers.

  - Quickly take matching or all items from containers.

  - Place/Take items in any order: valuable, cheapest, heaviest, lightest.

  Mod Link: https://nexusmods.com/morrowind/mods/57067
  Author: Arshvir Goraya
# CommonBehavior Section
SectionName_CommonBehavior: "Common Behavior"
SectionDescription_CommonBehavior: |-
  Control common behavior of place and take stack actions.
# AutoClose
SettingsNames_AutoClose: "Auto Close"
SettingsDescription_AutoClose: |-
  Control if container UI closes after stack action is performed.

  - Never: never close.
  - Always: always close.
  - Fit: close if all relevant items fit into the container.
AutoClose_Never: "Never"
AutoClose_Always: "Always"
AutoClose_Fit: "Fit"
# Modifier
SettingsNames_Modifier: "Modifier Key"
SettingsDescription_Modifier: |-
  Press along side take/place key to trigger modifier action.
Modifier_Shift: "Shift"
Modifier_Ctrl: "Ctrl"
Modifier_Alt: "Alt"
Modifier_Super: "Super"
# TakeStacks Section
SectionName_TakeStacks: "Take Stacks"
SectionDescription_TakeStacks: "Control behavior of the take stack action."
# KeyBind
SettingsNames_TakeStacksKeyBind: "Take Stacks Key Bind"
SettingsDescription_TakeStacksKeyBind: |-
  Press when container is open to trigger the take action.

SettingsNames_PlaceStacksKeyBind: "Place Stacks Key Bind"
SettingsDescription_PlaceStacksKeyBind: |-
  Press when container is open to trigger the place action.

SettingsNames_TransferOrder_Take: "Take Order"
SettingsDescription_TransferOrder_Take: |-
  Controls the order in which items are taken:
  - Valuable: most valuable items first.
  - ValuableByWeight: largest value-weight ratio first.
    - Will be a more valuable item set than the "Valuable" option.
  - Cheapest: cheapest items first.
  - Heaviest: As few items as possible by taking the heaviest items first.
  - Lightest: As many items as possible by taking the lightest items first.
    - Will be a heavier item set than the "Heaviest" option.

SettingsNames_TransferOrder_Place: "Place Order"
SettingsDescription_TransferOrder_Place: |-
  Controls the order in which items are placed:
  - Valuable: most valuable items first.
  - ValuableByWeight: largest value-weight ratio first.
    - Will be a more valuable item set than the "Valuable" option.
  - Cheapest: cheapest items first.
  - Heaviest: as few items as possible by taking the heaviest items first.
  - Lightest: as many items as possible by taking the lightest items first.
    - Will be a heavier item set than the "Heaviest" option.

TransferOrder_Any: "Any"
TransferOrder_Valuable: "Valuable"
TransferOrder_ValuableByWeight: "ValuableByWeight"
TransferOrder_Lightest: "Lightest"
TransferOrder_Cheapest: "Cheapest"
TransferOrder_Heaviest: "Heaviest"

SettingsNames_AllowOverEncumber: "Allow Over Encumber"
SettingsDescription_AllowOverEncumber: |-
  - No: take as many relevant items as you can carry without over encumbering.
  - Yes: take all relevant items and allow over encumbering.

SettingsNames_NotifyCountTransferred_Take: |-
  Show count taken
SettingsNames_NotifyCountTransferred_Place: |-
  Show count placed
SettingsDescription_NotifyCountTransferred_Take: |-
  - Yes: adds number of items taken from container to notification.
SettingsDescription_NotifyCountTransferred_Place: |-
  - Yes: adds number if items placed into container to notification.

SettingsNames_NotifyValueTransferred_Take: |-
  Show value taken
SettingsNames_NotifyValueTransferred_Place: |-
  Show value placed
SettingsDescription_NotifyValueTransferred_Take: |-
  - Yes: adds value of items taken from container to notification.
SettingsDescription_NotifyValueTransferred_Place: |-
  - Yes: adds value of items placed into container to notification.

SettingsNames_NotifyWeightTransferred_Take: |-
  Show weight taken
SettingsNames_NotifyWeightTransferred_Place: |-
  Show weight placed
SettingsDescription_NotifyWeightTransferred_Take: |-
  - Yes: adds weight of items taken from container to notification.
SettingsDescription_NotifyWeightTransferred_Place: |-
  - Yes: adds weight of items placed into container to notification.

SettingsNames_NotifyTypesNotAllTransferred_Take: |-
  Show item types not taken
SettingsNames_NotifyTypesNotAllTransferred_Place: |-
  Show item types not placed
SettingsDescription_NotifyTypesNotAllTransferred_Take: |-
  - Yes: adds list of types of items that could not be taken to notification.
SettingsDescription_NotifyTypesNotAllTransferred_Place: |-
  - Yes: adds list of types of items that could not be placed to notification.

#
SectionName_PlaceStacks: "Place Stacks"
SectionDescription_PlaceStacks: "Control behavior of the place stack action."
SettingsNames_HoldMS: "Place Stacks Hold Milliseconds"
SettingsDescription_HoldMS: |-
  - Hold "activate" key over container for MS to trigger place stack action.
  - Can press modifier along side this to trigger place stack modifier action.
  - Set to 0 to disable.

SettingsNames_DepositEquipped: "Deposit Equipped Items"
SettingsDescription_DepositEquipped: |-
  - No: won't deposit equipped items.

SettingsNames_DepositMoney: "Deposit Money"
SettingsDescription_DepositMoney: |-
  - No: won't deposit money.

SettingsNames_ModifierSetting: "Modifier Setting"
SettingsDescription_ModifierSetting: |-
  Control what the modifier key does when held along with place/take action key.
  - Default:
    - Press with modifier = take/place ALL items
    - Press without = take/place MATCHING items
  - Invert: Reverse of default
    - Press with modifier = take/place MATCHING items
    - Press without = take/place ALL items
  - Disabled: Modifier key does nothing
    - Always take/place MATCHING items

ModifierSetting_Default: "Default"
ModifierSetting_Invert: "Invert"
ModifierSetting_Disable: "Disable"
