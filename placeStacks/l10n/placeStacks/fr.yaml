---

ModName: "Placer des piles"
ModDescription: |-
  Inspiré du mécanisme de placement des piles de Valheim.

  - Placez rapidement les objets correspondants ou tous les objets dans des conteneurs.

  - Retirez rapidement les objets correspondants ou tous les objets des conteneurs.

  - Placez/Prenez les objets dans n'importe quel ordre : précieux, moins cher, plus lourd, plus léger.

  Lien du mod: https://nexusmods.com/morrowind/mods/57067
  Auteur: Arshvir Gorya
  Traduction: Google Translate. Contact author on nexus page if you can help make it better.
# CommonBehavior Section
SectionName_CommonBehavior: "Comportement commun"
SectionDescription_CommonBehavior: |-
  Contrôlez le comportement commun du lieu et effectuez des actions de pile.
# AutoClose
SettingsNames_AutoClose: "Fermeture automatique"
SettingsDescription_AutoClose: |-
  Contrôler si l'interface utilisateur du conteneur se ferme après l'exécution de l'action de la pile.

  - Jamais : ne jamais fermer.
  - Toujours : toujours fermer.
  - Ajuster : fermer si tous les éléments pertinents tiennent dans le conteneur.
AutoClose_Never: "Jamais"
AutoClose_Always: "Tourjours"
AutoClose_Fit: "Ajuster"
