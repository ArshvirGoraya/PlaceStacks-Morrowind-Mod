SettingsNames_TransferOrder_Take: "Prendre la commande"
SettingsDescription_TransferOrder_Take: |-
  Contrôle l'ordre de prise des objets:
  - Valeur : les objets les plus précieux en premier.
  - ValeurParPoids : le rapport valeur/poids le plus élevé en premier.
    - Ensemble d'objets de plus grande valeur que l'option « Valeur ».
  - Moins cher : les objets les moins chers en premier.
  - Plus lourd : le moins d'objets possible en prenant d'abord les objets les plus lourds.
  - Plus léger : le plus d'objets possible en prenant d'abord les objets les plus légers.
    - Ensemble d'objets plus lourd que l'option « Plus lourd ».

SettingsNames_TransferOrder_Place: "Passer une commande"
SettingsDescription_TransferOrder_Place: |-
  Contrôle l'ordre de placement des objets :
  - Valeur : les objets les plus précieux en premier.
  - ValeurParPoids : le rapport valeur/poids le plus élevé en premier.
    - L'ensemble d'objets aura une valeur supérieure à celle de l'option « Valeur ».
  - Moins cher : les objets les moins chers en premier.
  - Plus lourd : le moins d'objets possible en commençant par les plus lourds.
  - Plus léger : le plus d'objets possible en commençant par les plus légers.
    - L'ensemble d'objets aura une valeur supérieure à celle de l'option « Plus lourd ».

TransferOrder_Any: "N'importe lequel"
TransferOrder_Valuable: "Précieux"
TransferOrder_ValuableByWeight: "ValeurAuPoids"
TransferOrder_Lightest: "Le plus léger"
TransferOrder_Cheapest: "Le moins cher"
TransferOrder_Heaviest: "Le plus lourd"

SettingsNames_AllowOverEncumber: "Autoriser le surencombrement"
SettingsDescription_AllowOverEncumber: |-
  - Non : prenez autant d’articles pertinents que vous pouvez transporter sans les encombrer.
  - Oui : prenez tous les articles pertinents et autorisez le surencombrement.

