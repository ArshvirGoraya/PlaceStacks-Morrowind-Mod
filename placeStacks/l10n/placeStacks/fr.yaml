SectionName_PlaceStacks: "Placer des piles"
SectionDescription_PlaceStacks: "Contrôler le comportement de l'action de pile de lieux."
SettingsNames_HoldMS: "Les piles de lieux contiennent des millisecondes"
SettingsDescription_HoldMS: |-
  - Maintenez la touche « Activer » enfoncée au-dessus du conteneur pour que Microsoft déclenche l'action de placement de la pile.
  - Appuyez sur le bouton de modification à côté pour déclencher l'action de modification de placement de la pile.
  - Réglez sur 0 pour désactiver.

SettingsNames_DepositEquipped: "Déposer des objets équipés"
SettingsDescription_DepositEquipped: |-
  - Non : ne déposera pas les objets équipés.

SettingsNames_DepositMoney: "Deposit Money"
SettingsDescription_DepositMoney: |-
  Déposer de l'argent

SettingsNames_ModifierSetting: "Réglage du modificateur"
SettingsDescription_ModifierSetting: |-
  Contrôle l'action de la touche de modification lorsqu'elle est maintenue enfoncée en même temps que la touche d'action.
  - Par défaut :
    - Appuyer avec la touche de modification = prendre/placer TOUS les éléments
    - Appuyer sans la touche de modification = prendre/placer les éléments correspondants
  - Inverser : Inverse la valeur par défaut
    - Appuyer avec la touche de modification = prendre/placer les éléments correspondants
    - Appuyer sans la touche de modification = prendre/placer TOUS les éléments
  - Désactivé : La touche de modification ne fait rien
  - Toujours prendre/placer les éléments correspondants

ModifierSetting_Default: "Défaut"
ModifierSetting_Invert: "Inverser"
ModifierSetting_Disable: "Désactiver"

